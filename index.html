<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Royalty FX Pro LIVE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e14;color:#fff;font-family:system-ui;padding:10px}.h{background:linear-gradient(135deg,#f0b90b,#ff6a00);padding:16px;border-radius:14px;text-align:center}.h h1{color:#000;font-weight:900;font-size:22px}.live{background:#111a26;border:1px solid #1e2d42;border-radius:10px;padding:10px;display:flex;justify-content:space-between;margin-top:10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.card{background:#111a26;border:1px solid #1e2d42;border-radius:12px;padding:10px}.s{font-size:10px;color:#8b9bb4;font-weight:700}.p{font-size:15px;font-weight:900;margin:5px 0}.c{font-size:11px;padding:2px 7px;border-radius:12px}.up{background:#00ff881a;color:#00ff88}.down{background:#ff44441a;color:#ff4444}.bt{width:100%;margin-top:6px;padding:7px;border:none;border-radius:7px;font-weight:900;font-size:11px}.bu{background:#00ff88;color:#000}.se{background:#ff4444;color:#fff}.act{display:flex;gap:8px;margin-top:12px}.act button{flex:1;padding:13px;border:none;border-radius:11px;font-weight:900}.at{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000}.sg{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}</style></head><body><div class="h"><h1>👑 ROYALTY FX PRO</h1><p style="color:#000;font-weight:800;font-size:12px">LIVE • 18 SYMBOLS • 0.05 LOTS • AUTO</p></div><div class="live"><span>● LIVE</span><span id="t">--:--:--</span><span style="color:#00ff88">● CONNECTED</span></div><div class="grid" id="g"></div><div class="act"><button class="at" onclick="autoT()">▶ AUTO: OFF</button><button class="sg" onclick="sig()">⚡ SIGNALS</button></div><script>const S=[{i:'XAUUSD',b:2652},{i:'XAGUSD',b:31.2},{i:'EURUSD',b:1.085},{i:'GBPUSD',b:1.27},{i:'USDJPY',b:149.5},{i:'AUDUSD',b:.65},{i:'BTCUSD',b:67500},{i:'ETHUSD',b:2650},{i:'BNBUSD',b:605},{i:'US30',b:43200},{i:'NAS100',b:20150},{i:'SPX500',b:5820},{i:'GER40',b:19450},{i:'UK100',b:8250},{i:'USOIL',b:71.2},{i:'USDCHF',b:.885},{i:'USDCAD',b:1.365},{i:'NZDUSD',b:.61}];let P={},A=false;function init(){let g=document.getElementById('g');S.forEach(s=>{P[s.i]=s.b;let d=document.createElement('div');d.className='card';d.innerHTML=`<div class=s>${s.i}</div><div class=p id=p-${s.i}>${s.b}</div><div class="c up" id=c-${s.i}>+0.00% ▲</div><div style="display:flex;gap:4px"><button class="bt bu" onclick="tr('${s.i}','BUY')">BUY</button><button class="bt se" onclick="tr('${s.i}','SELL')">SELL</button></div>`;g.appendChild(d)});setInterval(()=>document.getElementById('t').textContent=new Date().toLocaleTimeString(),1000);setInterval(tick,400)}function tick(){S.forEach(s=>{P[s.i]+=(Math.random()-.5)*s.b*0.0006;let e=document.getElementById('p-'+s.i);let c=document.getElementById('c-'+s.i);if(e){e.textContent=P[s.i].toFixed(s.i.includes('JPY')||s.i.includes('BTC')||s.i.includes('US30')||s.i.includes('NAS')?1:2);let pct=(Math.random()-.47).toFixed(2);c.textContent=`${pct>0?'+':''}${pct}% ${pct>0?'▲':'▼'}`;c.className='c '+(pct>0?'up':'down')}})}function tr(sy,ty){alert(`👑 ${sy} ${ty}\n${P[sy].toFixed(2)}\nLot 0.05\n\nCopy to MT5!`)}function autoT(){A=!A;let b=document.querySelector('.at');b.textContent=A?'⏸ AUTO: ON':'▶ AUTO: OFF'}function sig(){let m='👑 TOP SIGNALS:\n\n';S.sort(()=>.5-Math.random()).slice(0,3).forEach(s=>{let d=Math.random()>.5?'BUY 🟢':'SELL 🔴';let cf=(70+Math.random()*25).toFixed(0);m+=`${s.i} ${d} (${cf}%)\n${P[s.i].toFixed(2)}\n\n`});alert(m)}init();</script></body></html>
