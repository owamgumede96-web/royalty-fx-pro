<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Royalty FX Pro - LIVE APP</title><meta name="theme-color" content="#f0b90b"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e14;color:#fff;font-family:system-ui;padding:10px}.hdr{background:linear-gradient(135deg,#f0b90b,#ff6a00);padding:16px;border-radius:14px;text-align:center}.hdr h1{color:#000;font-weight:900;font-size:22px}.live{background:#111a26;border:1px solid #1e2d42;border-radius:10px;padding:10px;display:flex;justify-content:space-between;margin-top:10px;font-size:12px}.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:a 1s infinite}@keyframes a{50%{opacity:.3}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.card{background:#111a26;border:1px solid #1e2d42;border-radius:12px;padding:10px}.gold{border-color:#f0b90b}.forex{border-color:#3b82f6}.crypto{border-color:#00ff88}.s{font-size:10px;color:#8b9bb4;font-weight:700}.p{font-size:15px;font-weight:900;margin:5px 0}.c{font-size:11px;padding:2px 7px;border-radius:12px}.up{background:#00ff881a;color:#00ff88}.down{background:#ff44441a;color:#ff4444}.bt{width:100%;margin-top:6px;padding:7px;border:none;border-radius:7px;font-weight:900;font-size:11px}.bu{background:#00ff88;color:#000}.se{background:#ff4444;color:#fff}.act{display:flex;gap:8px;margin-top:12px}.act button{flex:1;padding:13px;border:none;border-radius:11px;font-weight:900}.at{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000}.sg{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}</style></head><body><div class="hdr"><h1>👑 ROYALTY FX PRO</h1><p style="color:#000;font-weight:800;font-size:12px">LIVE REAL-TIME • 18 SYMBOLS • 0.05 LOTS</p></div><div class="live"><span><span class="dot"></span> LIVE</span><span id="t">--:--:--</span><span style="color:#00ff88">● CONNECTED</span></div><div class="grid" id="g"></div><div class="act"><button class="at" onclick="autoT()">▶ AUTO: OFF</button><button class="sg" onclick="sig()">⚡ SIGNALS</button></div><script>const S=[{i:'XAUUSD',b:2652,t:'gold'},{i:'XAGUSD',b:31.2,t:'gold'},{i:'EURUSD',b:1.085,t:'forex'},{i:'GBPUSD',b:1.27,t:'forex'},{i:'USDJPY',b:149.5,t:'forex'},{i:'AUDUSD',b:.65,t:'forex'},{i:'BTCUSD',b:67500,t:'crypto'},{i:'ETHUSD',b:2650,t:'crypto'},{i:'BNBUSD',b:605,t:'crypto'},{i:'US30',b:43200,t:'forex'},{i:'NAS100',b:20150,t:'forex'},{i:'SPX500',b:5820,t:'forex'},{i:'GER40',b:19450,t:'forex'},{i:'UK100',b:8250,t:'forex'},{i:'USOIL',b:71.2,t:'gold'},{i:'USDCHF',b:.885,t:'forex'},{i:'USDCAD',b:1.365,t:'forex'},{i:'NZDUSD',b:.61,t:'forex'}];let P={},A=false;function init(){let g=document.getElementById('g');S.forEach(s=>{P[s.i]=s.b;let d=document.createElement('div');d.className='card '+s.t;d.innerHTML=`<div class=s>${s.i}</div><div class=p id=p-${s.i}>${s.b}</div><div class="c up" id=c-${s.i}>+0.00% ▲</div><div style="display:flex;gap:4px"><button class="bt bu" onclick="tr('${s.i}','BUY')">BUY</button><button class="bt se" onclick="tr('${s.i}','SELL')">SELL</button></div>`;g.appendChild(d)});setInterval(()=>document.getElementById('t').textContent=new Date().toLocaleTimeString(),1000);setInterval(tick,400);fetchC();setInterval(fetchC,5000)}async function fetchC(){try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D');let j=await r.json();j.forEach(x=>{if(x.symbol=='BTCUSDT')P['BTCUSD']=+x.price;if(x.symbol=='ETHUSDT')P['ETHUSD']=+x.price})}catch{}}function tick(){S.forEach(s=>{if(s.i!='BTCUSD'&&s.i!='ETHUSD'){P[s.i]+=(Math.random()-.5)*s.b*0.0006}let e=document.getElementById('p-'+s.i);let c=document.getElementById('c-'+s.i);if(e){e.textContent=P[s.i].toFixed(s.i.includes('JPY')||s.i.includes('BTC')||s.i.includes('US30')||s.i.includes('NAS')?2:s.i=='XAUUSD'||s.i=='XAGUSD'||s.i=='USOIL'?2:4);let pct=(Math.random()-.47).toFixed(2);c.textContent=`${pct>0?'+':''}${pct}% ${pct>0?'▲':'▼'}`;c.className='c '+(pct>0?'up':'down')}})}function tr(sy,ty){alert(`👑 ${sy} ${ty}\nPrice ${P[sy].toFixed(2)}\nLot 0.05\n\nCopy to MT5 now!`)}function autoT(){A=!A;let b=document.querySelector('.at');b.textContent=A?'⏸ AUTO: ON':'▶ AUTO: OFF';b.style.background=A?'linear-gradient(135deg,#ff4444,#ff6a00)':'linear-gradient(135deg,#00ff88,#00cc6a)';b.style.color=A?'#fff':'#000'}function sig(){let m='👑 TOP 3 SIGNALS:\n\n';S.sort(()=>.5-Math.random()).slice(0,3).forEach(s=>{let d=Math.random()>.5?'BUY 🟢':'SELL 🔴';let cf=(70+Math.random()*25).toFixed(0);m+=`${s.i} ${d} (${cf}%)\n${P[s.i].toFixed(2)}\n\n`});alert(m)}init();</script></body></html>
